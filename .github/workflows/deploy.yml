name: Deploy to MonsterASP

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Use '9.0.x' if your Flat.csproj targets net9.0

      - name: Publish Web App
        run: dotnet publish Flat.csproj -c Release -o ./publish-output

      - name: Deploy to MonsterASP via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./publish-output/
          server-dir: /wwwroot/
          dangerous-clean-slate: false